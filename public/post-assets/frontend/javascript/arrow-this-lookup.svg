<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">일반 함수 콜백과 화살표 콜백의 this 탐색</title>
  <desc id="d">왼쪽 일반 함수 콜백은 호출될 때 자기 환경 레코드에 this 를 만들고 그 값(undefined)을 읽는다. 오른쪽 화살표 콜백의 환경에는 this 바인딩이 없어, 바깥 addAll 환경의 this(counter)를 읽는다.</desc>
  <defs>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7df1e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; white-space: pre; }
    .h { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    .env { fill: #e2e8f0; font-size: 14px; font-weight: 700; }
    .slot { fill: #cbd5e1; font-size: 13px; }
    .hit { fill: #fde047; font-size: 13px; font-weight: 700; }
    .miss { fill: #fca5a5; font-size: 13px; font-weight: 700; }
    .note { fill: #94a3b8; font-size: 12.5px; }
  </style>

  <rect width="960" height="440" rx="20" fill="#0f172a"/>

  <!-- 왼쪽: 일반 함수 -->
  <text class="h" x="40" y="48">일반 함수 콜백</text>
  <text class="note mono" x="40" y="72">items.forEach(function () { this.count++ })</text>

  <rect x="40" y="96" width="400" height="70" rx="10" fill="#111827" stroke="#334155"/>
  <text class="env" x="58" y="124">모듈 환경</text>
  <text class="slot mono" x="58" y="148">this = undefined</text>

  <rect x="40" y="184" width="400" height="70" rx="10" fill="#111827" stroke="#334155"/>
  <text class="env" x="58" y="212">addAll 환경</text>
  <text class="slot mono" x="58" y="236">this = counter</text>

  <rect x="40" y="272" width="400" height="86" rx="10" fill="#111827" stroke="#f87171" stroke-width="1.6"/>
  <text class="env" x="58" y="300">콜백 환경  [[ThisMode]] = strict</text>
  <text class="miss mono" x="58" y="326">this = undefined</text>
  <text class="note" x="58" y="346">forEach 가 thisArg 없이 호출해서 생긴 값</text>

  <path d="M300 392 C 360 392, 380 360, 380 332" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ag)"/>
  <text class="miss mono" x="196" y="398">this.count</text>
  <text class="note" x="40" y="424">자기 환경에서 this 를 찾고 멈춘다. undefined.count 는 TypeError, 예제는 if 로 건너뛴다.</text>

  <!-- 가운데 구분선 -->
  <line x1="480" y1="40" x2="480" y2="410" stroke="#334155" stroke-dasharray="4 6"/>

  <!-- 오른쪽: 화살표 함수 -->
  <text class="h" x="520" y="48">화살표 콜백</text>
  <text class="note mono" x="520" y="72">items.forEach(() =&gt; { this.count++ })</text>

  <rect x="520" y="96" width="400" height="70" rx="10" fill="#111827" stroke="#334155"/>
  <text class="env" x="538" y="124">모듈 환경</text>
  <text class="slot mono" x="538" y="148">this = undefined</text>

  <rect x="520" y="184" width="400" height="70" rx="10" fill="#1c1a0b" stroke="#f7df1e" stroke-width="1.6"/>
  <text class="env" x="538" y="212">addAll 환경</text>
  <text class="hit mono" x="538" y="236">this = counter</text>

  <rect x="520" y="272" width="400" height="86" rx="10" fill="#111827" stroke="#334155"/>
  <text class="env" x="538" y="300">콜백 환경  [[ThisMode]] = lexical</text>
  <text class="slot mono" x="538" y="326">this 바인딩 없음</text>
  <text class="note" x="538" y="346">HasThisBinding() → false, 건너뛴다</text>

  <path d="M860 392 C 900 392, 900 300, 900 250" fill="none" stroke="#f7df1e" stroke-width="2" marker-end="url(#ay)"/>
  <text class="hit mono" x="760" y="398">this.count</text>
  <text class="note" x="520" y="424">this 를 가진 첫 바깥 환경(addAll)에서 읽는다. 결과 3.</text>
</svg>
