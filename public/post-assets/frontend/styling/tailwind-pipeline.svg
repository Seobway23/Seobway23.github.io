<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Tailwind CSS 빌드 과정</title>
  <desc id="d">소스 파일을 텍스트로 읽어 클래스 후보를 추출하고, 유틸리티와 일치하는 후보만 CSS 규칙으로 생성해 utilities 레이어에 넣는다. 문자열을 조합한 클래스 이름은 후보에 나타나지 않아 생성되지 않는다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; white-space: pre; }
    .h { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    .t { fill: #cbd5e1; font-size: 13.5px; }
    .c { fill: #e2e8f0; font-size: 13px; }
    .ok { fill: #6ee7b7; font-size: 13px; }
    .no { fill: #fca5a5; font-size: 13px; }
    .step { fill: #38bdf8; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
  </style>

  <rect width="960" height="440" rx="20" fill="#0f172a"/>

  <!-- 1. 소스 -->
  <rect x="30" y="40" width="270" height="250" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text class="step" x="50" y="70">1 SCAN</text>
  <text class="h" x="50" y="96">소스 파일을 텍스트로 읽는다</text>
  <text class="t mono" x="50" y="126">Button.tsx</text>
  <rect x="50" y="138" width="230" height="130" rx="8" fill="#0b1220"/>
  <text class="c mono" x="62" y="164">&lt;button className=</text>
  <text class="c mono" x="62" y="186">  "p-4 bg-blue-500</text>
  <text class="c mono" x="62" y="208">   hover:bg-blue-600"&gt;</text>
  <text class="c mono" x="62" y="238">`text-${color}-500`</text>

  <!-- 2. 후보 -->
  <rect x="345" y="40" width="270" height="250" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text class="step" x="365" y="70">2 MATCH</text>
  <text class="h" x="365" y="96">후보 토큰을 유틸리티와 대조</text>
  <text class="ok mono" x="365" y="134">✓ p-4</text>
  <text class="ok mono" x="365" y="160">✓ bg-blue-500</text>
  <text class="ok mono" x="365" y="186">✓ hover:bg-blue-600</text>
  <text class="no mono" x="365" y="222">✗ text-${color}-500</text>
  <text class="t" x="365" y="248">완성된 클래스 이름이 아니라서</text>
  <text class="t" x="365" y="268">일치하는 유틸리티가 없다</text>

  <!-- 3. 출력 -->
  <rect x="660" y="40" width="270" height="250" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text class="step" x="680" y="70">3 GENERATE</text>
  <text class="h" x="680" y="96">쓰인 것만 CSS로 만든다</text>
  <rect x="680" y="112" width="230" height="156" rx="8" fill="#0b1220"/>
  <text class="c mono" x="692" y="136">@layer utilities {</text>
  <text class="c mono" x="692" y="160">  .p-4 {</text>
  <text class="c mono" x="692" y="180">    padding: calc(</text>
  <text class="c mono" x="692" y="200">      var(--spacing) * 4);</text>
  <text class="c mono" x="692" y="220">  }</text>
  <text class="c mono" x="692" y="242">  ...</text>
  <text class="c mono" x="692" y="262">}</text>

  <path d="M304 165 L340 165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M619 165 L655 165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 아래 설명 -->
  <rect x="30" y="316" width="900" height="96" rx="14" fill="#0b1220" stroke="#1e293b"/>
  <text class="h" x="54" y="350">스캐너는 코드를 실행하지 않는다</text>
  <text class="t" x="54" y="378">문자열 조합은 런타임에 일어난다. 빌드 시점의 스캐너는 소스에 그대로 적힌 토큰만 보므로</text>
  <text class="t" x="54" y="398">조합으로 만든 클래스 이름은 CSS 규칙이 생성되지 않는다. (Tailwind CSS 4.3.3 CLI로 확인)</text>
</svg>
