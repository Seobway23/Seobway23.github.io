<svg id="tb-tdz" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-tdz-t tb-tdz-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-tdz-t">TDZ(Temporal Dead Zone)</title>
  <desc id="tb-tdz-d">frontend/javascript — 외부 스코프에 같은 이름의 변수가 있어도 ReferenceError 가 발생하는 이유</desc>

  <defs>
    <linearGradient id="tb-tdz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-tdz-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-tdz-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-tdz-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-tdz-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-tdz-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-tdz-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-tdz-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-tdz-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-tdz-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-tdz-glow-a { animation: tb-tdz-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-tdz-glow-b { animation: tb-tdz-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-tdz-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-tdz-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-tdz-spark { fill: #ffffff; opacity: 0; animation-name: tb-tdz-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-tdz-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-tdz-sheen-band { animation: tb-tdz-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-tdz-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-tdz-caret { animation: tb-tdz-blink 1.1s steps(1) infinite; }
    @keyframes tb-tdz-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-tdz-halo { animation: tb-tdz-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-tdz-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-tdz-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-tdz-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-tdz-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-tdz-badge-ring { animation: tb-tdz-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-tdz-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-tdz-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-tdz-tshadow); transition: fill .35s ease; }
    .tb-tdz-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-tdz-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-tdz-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-tdz-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-tdz-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-tdz-c-key    { fill: #f7df1e; }
    .tb-tdz-c-string { fill: #86efac; }
    .tb-tdz-c-number { fill: #fbbf24; }
    .tb-tdz-c-comment{ fill: #64748b; font-style: italic; }
    .tb-tdz-c-ident  { fill: #cbd5e1; }
    .tb-tdz-c-punct  { fill: #94a3b8; }
    .tb-tdz-c-op     { fill: hsl(198 93% 70%); }
    .tb-tdz-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-tdz:hover .tb-tdz-glow-a,
    #tb-tdz:hover .tb-tdz-glow-b     { animation-duration: 6s; }
    #tb-tdz:hover .tb-tdz-code       { opacity: .62; }
    #tb-tdz:hover .tb-tdz-spark      { animation-duration: 1.4s !important; }
    #tb-tdz:hover .tb-tdz-sheen-band { animation-duration: 2.6s; }
    #tb-tdz:hover .tb-tdz-title      { fill: #ffffff; }
    #tb-tdz:hover .tb-tdz-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-tdz:hover .tb-tdz-badge      { transform: translateY(-5px); }
    .tb-tdz-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-tdz-glow-a, .tb-tdz-glow-b, .tb-tdz-spark, .tb-tdz-sheen-band, .tb-tdz-caret, .tb-tdz-halo, .tb-tdz-badge-ring, .tb-tdz-bracket {
        animation: none !important;
      }
      .tb-tdz-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-tdz-frame)">
    <rect width="1200" height="630" fill="url(#tb-tdz-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-tdz-grid)"/>

    <circle class="tb-tdz-glow-a" cx="315" cy="185" r="322" fill="url(#tb-tdz-ga)"/>
    <circle class="tb-tdz-glow-b" cx="888" cy="496" r="381" fill="url(#tb-tdz-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-tdz-code" font-size="21"><tspan class="tb-tdz-c-key" xml:space="preserve">let</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">x</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-op" xml:space="preserve">=</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-string" xml:space="preserve">&quot;바깥&quot;</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="140.12" class="tb-tdz-code" font-size="21"><tspan class="tb-tdz-c-punct" xml:space="preserve">{</tspan></text>
      <text x="64" y="176.24" class="tb-tdz-code" font-size="21"><tspan class="tb-tdz-c-plain" xml:space="preserve">  </tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">console</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">.</tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">log</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">(</tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">x</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">)</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">;</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve">   </tspan><tspan class="tb-tdz-c-comment" xml:space="preserve">// ReferenceError: Cannot a…</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-tdz-code" font-size="21"><tspan class="tb-tdz-c-plain" xml:space="preserve">  </tspan><tspan class="tb-tdz-c-key" xml:space="preserve">let</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">x</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-op" xml:space="preserve">=</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-string" xml:space="preserve">&quot;안쪽&quot;</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="248.48" class="tb-tdz-code" font-size="21"><tspan class="tb-tdz-c-punct" xml:space="preserve">}</tspan></text>
      <rect class="tb-tdz-caret" x="81" y="231"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-tdz-code" font-size="17"><tspan class="tb-tdz-c-key" xml:space="preserve">let</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">x</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-op" xml:space="preserve">=</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-string" xml:space="preserve">&quot;바깥&quot;</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="386.6" class="tb-tdz-code" font-size="17"><tspan class="tb-tdz-c-punct" xml:space="preserve">{</tspan></text>
      <text x="690" y="417.2" class="tb-tdz-code" font-size="17"><tspan class="tb-tdz-c-plain" xml:space="preserve">  </tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">console</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">.</tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">log</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">(</tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">x</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">)</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">;</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve">   </tspan><tspan class="tb-tdz-c-comment" xml:space="preserve">// ReferenceError: Cannot a…</tspan></text>
      <text x="690" y="447.8" class="tb-tdz-code" font-size="17"><tspan class="tb-tdz-c-plain" xml:space="preserve">  </tspan><tspan class="tb-tdz-c-key" xml:space="preserve">let</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-ident" xml:space="preserve">x</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-op" xml:space="preserve">=</tspan><tspan class="tb-tdz-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tdz-c-string" xml:space="preserve">&quot;안쪽&quot;</tspan><tspan class="tb-tdz-c-punct" xml:space="preserve">;</tspan></text>
    </g>

    <circle class="tb-tdz-spark" cx="270" cy="353" r="3.36" style="animation-delay:2.51s;animation-duration:5.81s"/>
    <circle class="tb-tdz-spark" cx="953" cy="199" r="1.86" style="animation-delay:3.36s;animation-duration:4.86s"/>
    <circle class="tb-tdz-spark" cx="168" cy="561" r="2.82" style="animation-delay:0.83s;animation-duration:5.85s"/>
    <circle class="tb-tdz-spark" cx="1135" cy="369" r="2.96" style="animation-delay:1.21s;animation-duration:3.65s"/>
    <circle class="tb-tdz-spark" cx="1067" cy="166" r="2.86" style="animation-delay:2.60s;animation-duration:5.52s"/>
    <circle class="tb-tdz-spark" cx="919" cy="222" r="3.43" style="animation-delay:2.41s;animation-duration:4.54s"/>
    <circle class="tb-tdz-spark" cx="213" cy="67" r="3.87" style="animation-delay:1.19s;animation-duration:4.31s"/>
    <circle class="tb-tdz-spark" cx="262" cy="391" r="2.34" style="animation-delay:3.40s;animation-duration:5.10s"/>
    <circle class="tb-tdz-spark" cx="122" cy="514" r="2.03" style="animation-delay:5.71s;animation-duration:6.17s"/>
    <circle class="tb-tdz-spark" cx="906" cy="430" r="4.00" style="animation-delay:2.76s;animation-duration:4.57s"/>
    <circle class="tb-tdz-spark" cx="267" cy="560" r="3.69" style="animation-delay:0.39s;animation-duration:3.30s"/>
    <circle class="tb-tdz-spark" cx="1081" cy="64" r="2.81" style="animation-delay:2.12s;animation-duration:4.90s"/>
    <circle class="tb-tdz-spark" cx="971" cy="120" r="2.15" style="animation-delay:5.47s;animation-duration:6.55s"/>
    <circle class="tb-tdz-spark" cx="317" cy="447" r="1.78" style="animation-delay:5.58s;animation-duration:5.19s"/>
    <circle class="tb-tdz-spark" cx="174" cy="560" r="2.49" style="animation-delay:3.30s;animation-duration:6.13s"/>
    <circle class="tb-tdz-spark" cx="999" cy="105" r="2.42" style="animation-delay:0.21s;animation-duration:5.45s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-tdz-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-tdz-vignette)"/>

    <g class="tb-tdz-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-tdz-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="206" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-tdz-chip-t" x="600" y="234" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-tdz-title" x="600" y="306" text-anchor="middle" font-size="62">TDZ(Temporal Dead Zone)</text>

    <rect x="470" y="362" width="260" height="2" rx="1" fill="url(#tb-tdz-rule)"/>
    <text class="tb-tdz-sub" x="600" y="416" text-anchor="middle" font-size="25">외부 스코프에 같은 이름의 변수가 있어도 ReferenceError 가…</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-tdz-badge">
      <circle class="tb-tdz-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-tdz-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-tdz-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-tdz-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-tdz-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-tdz-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-tdz-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-tdz-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
