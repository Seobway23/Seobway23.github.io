<svg id="tb-tailwind-css" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-tailwind-css-t tb-tailwind-css-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-tailwind-css-t">Tailwind CSS 유틸리티 생성 과정</title>
  <desc id="tb-tailwind-css-d">frontend/styling — 소스를 스캔해 쓰인 클래스만 CSS로 만든다</desc>

  <defs>
    <linearGradient id="tb-tailwind-css-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-tailwind-css-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 64%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 64%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-tailwind-css-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-tailwind-css-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-tailwind-css-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 64%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 64%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 64%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-tailwind-css-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-tailwind-css-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-tailwind-css-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-tailwind-css-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-tailwind-css-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-tailwind-css-glow-a { animation: tb-tailwind-css-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-tailwind-css-glow-b { animation: tb-tailwind-css-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-tailwind-css-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-tailwind-css-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-tailwind-css-spark { fill: #ffffff; opacity: 0; animation-name: tb-tailwind-css-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-tailwind-css-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-tailwind-css-sheen-band { animation: tb-tailwind-css-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-tailwind-css-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-tailwind-css-caret { animation: tb-tailwind-css-blink 1.1s steps(1) infinite; }
    @keyframes tb-tailwind-css-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-tailwind-css-halo { animation: tb-tailwind-css-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-tailwind-css-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-tailwind-css-bracket { stroke: hsl(198 93% 64%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-tailwind-css-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-tailwind-css-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-tailwind-css-badge-ring { animation: tb-tailwind-css-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-tailwind-css-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-tailwind-css-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-tailwind-css-tshadow); transition: fill .35s ease; }
    .tb-tailwind-css-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-tailwind-css-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 64%); letter-spacing: 2.6px; }
    .tb-tailwind-css-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-tailwind-css-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-tailwind-css-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-tailwind-css-c-key    { fill: #06B6D4; }
    .tb-tailwind-css-c-string { fill: #86efac; }
    .tb-tailwind-css-c-number { fill: #fbbf24; }
    .tb-tailwind-css-c-comment{ fill: #64748b; font-style: italic; }
    .tb-tailwind-css-c-ident  { fill: #cbd5e1; }
    .tb-tailwind-css-c-punct  { fill: #94a3b8; }
    .tb-tailwind-css-c-op     { fill: hsl(198 93% 64%); }
    .tb-tailwind-css-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-tailwind-css:hover .tb-tailwind-css-glow-a,
    #tb-tailwind-css:hover .tb-tailwind-css-glow-b     { animation-duration: 6s; }
    #tb-tailwind-css:hover .tb-tailwind-css-code       { opacity: .62; }
    #tb-tailwind-css:hover .tb-tailwind-css-spark      { animation-duration: 1.4s !important; }
    #tb-tailwind-css:hover .tb-tailwind-css-sheen-band { animation-duration: 2.6s; }
    #tb-tailwind-css:hover .tb-tailwind-css-title      { fill: #ffffff; }
    #tb-tailwind-css:hover .tb-tailwind-css-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-tailwind-css:hover .tb-tailwind-css-badge      { transform: translateY(-5px); }
    .tb-tailwind-css-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-tailwind-css-glow-a, .tb-tailwind-css-glow-b, .tb-tailwind-css-spark, .tb-tailwind-css-sheen-band, .tb-tailwind-css-caret, .tb-tailwind-css-halo, .tb-tailwind-css-badge-ring, .tb-tailwind-css-bracket {
        animation: none !important;
      }
      .tb-tailwind-css-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-tailwind-css-frame)">
    <rect width="1200" height="630" fill="url(#tb-tailwind-css-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-tailwind-css-grid)"/>

    <circle class="tb-tailwind-css-glow-a" cx="176" cy="209" r="369" fill="url(#tb-tailwind-css-ga)"/>
    <circle class="tb-tailwind-css-glow-b" cx="832" cy="404" r="397" fill="url(#tb-tailwind-css-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-tailwind-css-code" font-size="21"><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">@</tspan><tspan class="tb-tailwind-css-c-key" xml:space="preserve">import</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-string" xml:space="preserve">&quot;tailwindcss&quot;</tspan><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="140.12" class="tb-tailwind-css-code" font-size="21"></text>
      <text x="64" y="176.24" class="tb-tailwind-css-code" font-size="21"><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">@</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">theme</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">{</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-tailwind-css-code" font-size="21"><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">  </tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">--</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">color</tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">-</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">brand</tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">:</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">#</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">7</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">c3aed</tspan><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="248.48" class="tb-tailwind-css-code" font-size="21"><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">}</tspan></text>
      <text x="64" y="284.6" class="tb-tailwind-css-code" font-size="21"></text>
      <text x="64" y="320.71999999999997" class="tb-tailwind-css-code" font-size="21"><tspan class="tb-tailwind-css-c-op" xml:space="preserve">&lt;</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">button</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-key" xml:space="preserve">class</tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">=</tspan><tspan class="tb-tailwind-css-c-string" xml:space="preserve">&quot;p-4 bg-brand hover:opacity-90 md:px-8&quot;</tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">&gt;</tspan></text>
      <rect class="tb-tailwind-css-caret" x="748" y="304"
            width="10" height="25" fill="#06B6D4" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-tailwind-css-code" font-size="17"><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">@</tspan><tspan class="tb-tailwind-css-c-key" xml:space="preserve">import</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-string" xml:space="preserve">&quot;tailwindcss&quot;</tspan><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="386.6" class="tb-tailwind-css-code" font-size="17"></text>
      <text x="690" y="417.2" class="tb-tailwind-css-code" font-size="17"><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">@</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">theme</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">{</tspan></text>
      <text x="690" y="447.8" class="tb-tailwind-css-code" font-size="17"><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">  </tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">--</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">color</tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">-</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">brand</tspan><tspan class="tb-tailwind-css-c-op" xml:space="preserve">:</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve"> </tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">#</tspan><tspan class="tb-tailwind-css-c-plain" xml:space="preserve">7</tspan><tspan class="tb-tailwind-css-c-ident" xml:space="preserve">c3aed</tspan><tspan class="tb-tailwind-css-c-punct" xml:space="preserve">;</tspan></text>
    </g>

    <circle class="tb-tailwind-css-spark" cx="269" cy="398" r="2.66" style="animation-delay:4.41s;animation-duration:5.30s"/>
    <circle class="tb-tailwind-css-spark" cx="124" cy="285" r="2.85" style="animation-delay:1.13s;animation-duration:5.23s"/>
    <circle class="tb-tailwind-css-spark" cx="150" cy="210" r="3.56" style="animation-delay:4.82s;animation-duration:5.97s"/>
    <circle class="tb-tailwind-css-spark" cx="1043" cy="368" r="2.72" style="animation-delay:5.82s;animation-duration:3.66s"/>
    <circle class="tb-tailwind-css-spark" cx="1125" cy="230" r="2.09" style="animation-delay:5.01s;animation-duration:4.17s"/>
    <circle class="tb-tailwind-css-spark" cx="184" cy="183" r="3.54" style="animation-delay:0.42s;animation-duration:5.26s"/>
    <circle class="tb-tailwind-css-spark" cx="304" cy="62" r="2.36" style="animation-delay:0.90s;animation-duration:5.54s"/>
    <circle class="tb-tailwind-css-spark" cx="246" cy="557" r="2.18" style="animation-delay:4.63s;animation-duration:6.56s"/>
    <circle class="tb-tailwind-css-spark" cx="1013" cy="344" r="3.84" style="animation-delay:3.80s;animation-duration:4.27s"/>
    <circle class="tb-tailwind-css-spark" cx="1091" cy="247" r="1.67" style="animation-delay:1.93s;animation-duration:6.23s"/>
    <circle class="tb-tailwind-css-spark" cx="319" cy="546" r="1.82" style="animation-delay:3.66s;animation-duration:4.99s"/>
    <circle class="tb-tailwind-css-spark" cx="319" cy="340" r="2.13" style="animation-delay:4.05s;animation-duration:4.23s"/>
    <circle class="tb-tailwind-css-spark" cx="110" cy="94" r="2.41" style="animation-delay:0.98s;animation-duration:3.99s"/>
    <circle class="tb-tailwind-css-spark" cx="143" cy="205" r="3.87" style="animation-delay:5.79s;animation-duration:3.84s"/>
    <circle class="tb-tailwind-css-spark" cx="979" cy="96" r="2.27" style="animation-delay:5.72s;animation-duration:3.33s"/>
    <circle class="tb-tailwind-css-spark" cx="1041" cy="383" r="2.08" style="animation-delay:4.22s;animation-duration:3.80s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-tailwind-css-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-tailwind-css-vignette)"/>

    <g class="tb-tailwind-css-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-tailwind-css-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="464" y="166" width="272" height="42" rx="21"
            fill="hsl(198 93% 64%)" fill-opacity="0.13" stroke="hsl(198 93% 64%)" stroke-opacity="0.55"/>
      <text class="tb-tailwind-css-chip-t" x="600" y="194" text-anchor="middle" font-size="19">FRONTEND/STYLING</text>
    </g>

    <text class="tb-tailwind-css-title" x="600" y="266" text-anchor="middle" font-size="62">Tailwind CSS</text>
      <text class="tb-tailwind-css-title" x="600" y="345" text-anchor="middle" font-size="62">유틸리티 생성 과정</text>

    <rect x="470" y="401" width="260" height="2" rx="1" fill="url(#tb-tailwind-css-rule)"/>
    <text class="tb-tailwind-css-sub" x="600" y="455" text-anchor="middle" font-size="25">소스를 스캔해 쓰인 클래스만 CSS로 만든다</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-tailwind-css-badge">
      <circle class="tb-tailwind-css-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#06B6D4" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16" fill="#f8fafc"/>
      <path transform="translate(78 516) scale(1.5)" fill="#06B6D4" d="M12.001,4.8c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624 C13.666,10.618,15.027,12,18.001,12c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624 C16.337,6.182,14.976,4.8,12.001,4.8z M6.001,12c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624 c1.177,1.194,2.538,2.576,5.512,2.576c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624 C10.337,13.382,8.976,12,6.001,12z"/>
    </g>

    <text class="tb-tailwind-css-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/STYLING</text>
    <text class="tb-tailwind-css-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-tailwind-css-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-tailwind-css-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-tailwind-css-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-tailwind-css-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 64%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
