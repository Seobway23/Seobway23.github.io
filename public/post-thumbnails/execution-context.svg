<svg id="tb-execution-context" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-execution-context-t tb-execution-context-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-execution-context-t">실행 컨텍스트 — 함수가 실행될 때 만들어지는 환경</title>
  <desc id="tb-execution-context-d">frontend/javascript — 콜 스택에 쌓이는 것의 정체</desc>

  <defs>
    <linearGradient id="tb-execution-context-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-execution-context-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-execution-context-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-execution-context-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-execution-context-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-execution-context-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-execution-context-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-execution-context-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-execution-context-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-execution-context-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-execution-context-glow-a { animation: tb-execution-context-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-execution-context-glow-b { animation: tb-execution-context-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-execution-context-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-execution-context-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-execution-context-spark { fill: #ffffff; opacity: 0; animation-name: tb-execution-context-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-execution-context-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-execution-context-sheen-band { animation: tb-execution-context-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-execution-context-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-execution-context-caret { animation: tb-execution-context-blink 1.1s steps(1) infinite; }
    @keyframes tb-execution-context-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-execution-context-halo { animation: tb-execution-context-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-execution-context-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-execution-context-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-execution-context-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-execution-context-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-execution-context-badge-ring { animation: tb-execution-context-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-execution-context-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-execution-context-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-execution-context-tshadow); transition: fill .35s ease; }
    .tb-execution-context-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-execution-context-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-execution-context-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-execution-context-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-execution-context-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-execution-context-c-key    { fill: #f7df1e; }
    .tb-execution-context-c-string { fill: #86efac; }
    .tb-execution-context-c-number { fill: #fbbf24; }
    .tb-execution-context-c-comment{ fill: #64748b; font-style: italic; }
    .tb-execution-context-c-ident  { fill: #cbd5e1; }
    .tb-execution-context-c-punct  { fill: #94a3b8; }
    .tb-execution-context-c-op     { fill: hsl(198 93% 70%); }
    .tb-execution-context-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-execution-context:hover .tb-execution-context-glow-a,
    #tb-execution-context:hover .tb-execution-context-glow-b     { animation-duration: 6s; }
    #tb-execution-context:hover .tb-execution-context-code       { opacity: .62; }
    #tb-execution-context:hover .tb-execution-context-spark      { animation-duration: 1.4s !important; }
    #tb-execution-context:hover .tb-execution-context-sheen-band { animation-duration: 2.6s; }
    #tb-execution-context:hover .tb-execution-context-title      { fill: #ffffff; }
    #tb-execution-context:hover .tb-execution-context-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-execution-context:hover .tb-execution-context-badge      { transform: translateY(-5px); }
    .tb-execution-context-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-execution-context-glow-a, .tb-execution-context-glow-b, .tb-execution-context-spark, .tb-execution-context-sheen-band, .tb-execution-context-caret, .tb-execution-context-halo, .tb-execution-context-badge-ring, .tb-execution-context-bracket {
        animation: none !important;
      }
      .tb-execution-context-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-execution-context-frame)">
    <rect width="1200" height="630" fill="url(#tb-execution-context-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-execution-context-grid)"/>

    <circle class="tb-execution-context-glow-a" cx="234" cy="241" r="318" fill="url(#tb-execution-context-ga)"/>
    <circle class="tb-execution-context-glow-b" cx="784" cy="413" r="411" fill="url(#tb-execution-context-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-execution-context-code" font-size="21"><tspan class="tb-execution-context-c-key" xml:space="preserve">function</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">greet</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">(</tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">name</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">)</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">{</tspan></text>
      <text x="64" y="140.12" class="tb-execution-context-code" font-size="21"><tspan class="tb-execution-context-c-plain" xml:space="preserve">  </tspan><tspan class="tb-execution-context-c-key" xml:space="preserve">const</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">message</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-op" xml:space="preserve">=</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-string" xml:space="preserve">`안녕, ${name}`</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="176.24" class="tb-execution-context-code" font-size="21"><tspan class="tb-execution-context-c-plain" xml:space="preserve">  </tspan><tspan class="tb-execution-context-c-key" xml:space="preserve">return</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">message</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-execution-context-code" font-size="21"><tspan class="tb-execution-context-c-punct" xml:space="preserve">}</tspan></text>
      <text x="64" y="248.48" class="tb-execution-context-code" font-size="21"><tspan class="tb-execution-context-c-ident" xml:space="preserve">greet</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">(</tspan><tspan class="tb-execution-context-c-string" xml:space="preserve">&quot;A&quot;</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">)</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">;</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve">   </tspan><tspan class="tb-execution-context-c-comment" xml:space="preserve">// message = &quot;안녕, A&quot;   ← 이 호출만의 환경</tspan></text>
      <text x="64" y="284.6" class="tb-execution-context-code" font-size="21"><tspan class="tb-execution-context-c-ident" xml:space="preserve">greet</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">(</tspan><tspan class="tb-execution-context-c-string" xml:space="preserve">&quot;B&quot;</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">)</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">;</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve">   </tspan><tspan class="tb-execution-context-c-comment" xml:space="preserve">// message = &quot;안녕, B&quot;   ← 별개의 환경</tspan></text>
      <rect class="tb-execution-context-caret" x="635" y="268"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-execution-context-code" font-size="17"><tspan class="tb-execution-context-c-key" xml:space="preserve">function</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">greet</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">(</tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">name</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">)</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">{</tspan></text>
      <text x="690" y="386.6" class="tb-execution-context-code" font-size="17"><tspan class="tb-execution-context-c-plain" xml:space="preserve">  </tspan><tspan class="tb-execution-context-c-key" xml:space="preserve">const</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">message</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-op" xml:space="preserve">=</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-string" xml:space="preserve">`안녕, ${name}`</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="417.2" class="tb-execution-context-code" font-size="17"><tspan class="tb-execution-context-c-plain" xml:space="preserve">  </tspan><tspan class="tb-execution-context-c-key" xml:space="preserve">return</tspan><tspan class="tb-execution-context-c-plain" xml:space="preserve"> </tspan><tspan class="tb-execution-context-c-ident" xml:space="preserve">message</tspan><tspan class="tb-execution-context-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="447.8" class="tb-execution-context-code" font-size="17"><tspan class="tb-execution-context-c-punct" xml:space="preserve">}</tspan></text>
    </g>

    <circle class="tb-execution-context-spark" cx="140" cy="214" r="1.75" style="animation-delay:3.95s;animation-duration:6.07s"/>
    <circle class="tb-execution-context-spark" cx="305" cy="355" r="3.84" style="animation-delay:4.00s;animation-duration:6.43s"/>
    <circle class="tb-execution-context-spark" cx="883" cy="142" r="3.75" style="animation-delay:5.38s;animation-duration:6.12s"/>
    <circle class="tb-execution-context-spark" cx="1082" cy="424" r="2.85" style="animation-delay:4.55s;animation-duration:5.78s"/>
    <circle class="tb-execution-context-spark" cx="299" cy="97" r="3.01" style="animation-delay:1.61s;animation-duration:4.50s"/>
    <circle class="tb-execution-context-spark" cx="65" cy="73" r="1.45" style="animation-delay:4.92s;animation-duration:3.24s"/>
    <circle class="tb-execution-context-spark" cx="1132" cy="561" r="2.63" style="animation-delay:1.66s;animation-duration:4.11s"/>
    <circle class="tb-execution-context-spark" cx="68" cy="267" r="1.93" style="animation-delay:1.89s;animation-duration:4.06s"/>
    <circle class="tb-execution-context-spark" cx="1021" cy="496" r="1.81" style="animation-delay:2.63s;animation-duration:4.20s"/>
    <circle class="tb-execution-context-spark" cx="1059" cy="495" r="2.05" style="animation-delay:1.27s;animation-duration:3.89s"/>
    <circle class="tb-execution-context-spark" cx="910" cy="201" r="3.34" style="animation-delay:1.42s;animation-duration:6.20s"/>
    <circle class="tb-execution-context-spark" cx="1132" cy="238" r="2.02" style="animation-delay:1.38s;animation-duration:4.32s"/>
    <circle class="tb-execution-context-spark" cx="66" cy="91" r="2.31" style="animation-delay:4.09s;animation-duration:3.47s"/>
    <circle class="tb-execution-context-spark" cx="78" cy="248" r="3.52" style="animation-delay:5.70s;animation-duration:6.33s"/>
    <circle class="tb-execution-context-spark" cx="1089" cy="333" r="3.44" style="animation-delay:2.38s;animation-duration:3.64s"/>
    <circle class="tb-execution-context-spark" cx="1055" cy="538" r="2.42" style="animation-delay:0.92s;animation-duration:5.69s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-execution-context-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-execution-context-vignette)"/>

    <g class="tb-execution-context-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-execution-context-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="176" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-execution-context-chip-t" x="600" y="204" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-execution-context-title" x="600" y="276" text-anchor="middle" font-size="54">실행 컨텍스트 — 함수가</text>
      <text class="tb-execution-context-title" x="600" y="345" text-anchor="middle" font-size="54">실행될 때 만들어지는 환경</text>

    <rect x="470" y="401" width="260" height="2" rx="1" fill="url(#tb-execution-context-rule)"/>
    <text class="tb-execution-context-sub" x="600" y="455" text-anchor="middle" font-size="25">콜 스택에 쌓이는 것의 정체</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-execution-context-badge">
      <circle class="tb-execution-context-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-execution-context-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-execution-context-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-execution-context-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-execution-context-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-execution-context-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-execution-context-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-execution-context-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
