<svg id="tb-sass-scss" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-sass-scss-t tb-sass-scss-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-sass-scss-t">Sass 전처리와 SCSS 모듈</title>
  <desc id="tb-sass-scss-d">frontend/styling — 컴파일 시점에 사라지는 변수와 모듈</desc>

  <defs>
    <linearGradient id="tb-sass-scss-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-sass-scss-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 64%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 64%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-sass-scss-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CC6699" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#CC6699" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-sass-scss-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#CC6699" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-sass-scss-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 64%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 64%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 64%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-sass-scss-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-sass-scss-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-sass-scss-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-sass-scss-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-sass-scss-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-sass-scss-glow-a { animation: tb-sass-scss-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-sass-scss-glow-b { animation: tb-sass-scss-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-sass-scss-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-sass-scss-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-sass-scss-spark { fill: #ffffff; opacity: 0; animation-name: tb-sass-scss-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-sass-scss-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-sass-scss-sheen-band { animation: tb-sass-scss-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-sass-scss-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-sass-scss-caret { animation: tb-sass-scss-blink 1.1s steps(1) infinite; }
    @keyframes tb-sass-scss-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-sass-scss-halo { animation: tb-sass-scss-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-sass-scss-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-sass-scss-bracket { stroke: hsl(198 93% 64%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-sass-scss-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-sass-scss-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-sass-scss-badge-ring { animation: tb-sass-scss-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-sass-scss-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-sass-scss-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-sass-scss-tshadow); transition: fill .35s ease; }
    .tb-sass-scss-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-sass-scss-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 64%); letter-spacing: 2.6px; }
    .tb-sass-scss-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-sass-scss-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-sass-scss-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-sass-scss-c-key    { fill: #CC6699; }
    .tb-sass-scss-c-string { fill: #86efac; }
    .tb-sass-scss-c-number { fill: #fbbf24; }
    .tb-sass-scss-c-comment{ fill: #64748b; font-style: italic; }
    .tb-sass-scss-c-ident  { fill: #cbd5e1; }
    .tb-sass-scss-c-punct  { fill: #94a3b8; }
    .tb-sass-scss-c-op     { fill: hsl(198 93% 64%); }
    .tb-sass-scss-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-sass-scss:hover .tb-sass-scss-glow-a,
    #tb-sass-scss:hover .tb-sass-scss-glow-b     { animation-duration: 6s; }
    #tb-sass-scss:hover .tb-sass-scss-code       { opacity: .62; }
    #tb-sass-scss:hover .tb-sass-scss-spark      { animation-duration: 1.4s !important; }
    #tb-sass-scss:hover .tb-sass-scss-sheen-band { animation-duration: 2.6s; }
    #tb-sass-scss:hover .tb-sass-scss-title      { fill: #ffffff; }
    #tb-sass-scss:hover .tb-sass-scss-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-sass-scss:hover .tb-sass-scss-badge      { transform: translateY(-5px); }
    .tb-sass-scss-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-sass-scss-glow-a, .tb-sass-scss-glow-b, .tb-sass-scss-spark, .tb-sass-scss-sheen-band, .tb-sass-scss-caret, .tb-sass-scss-halo, .tb-sass-scss-badge-ring, .tb-sass-scss-bracket {
        animation: none !important;
      }
      .tb-sass-scss-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-sass-scss-frame)">
    <rect width="1200" height="630" fill="url(#tb-sass-scss-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-sass-scss-grid)"/>

    <circle class="tb-sass-scss-glow-a" cx="264" cy="177" r="420" fill="url(#tb-sass-scss-ga)"/>
    <circle class="tb-sass-scss-glow-b" cx="1076" cy="514" r="410" fill="url(#tb-sass-scss-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">@</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">use</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-string" xml:space="preserve">&quot;sass:math&quot;</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="140.12" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">@</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">use</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-string" xml:space="preserve">&quot;tokens&quot;</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="176.24" class="tb-sass-scss-code" font-size="21"></text>
      <text x="64" y="212.35999999999999" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-punct" xml:space="preserve">.</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">card</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">{</tspan></text>
      <text x="64" y="248.48" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">  </tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">padding</tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">:</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">math</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">.</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">div</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">(</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">tokens</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">.</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">$space</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">,</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-number" xml:space="preserve">2</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">)</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="284.6" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">  </tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">&amp;</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">__title</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">{</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">font</tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">-</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">weight</tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">:</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-number" xml:space="preserve">700</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">}</tspan></text>
      <text x="64" y="320.71999999999997" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">  </tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">&amp;:</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">hover</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">{</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">border</tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">-</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">color</tspan><tspan class="tb-sass-scss-c-op" xml:space="preserve">:</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">tokens</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">.</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">$brand</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">}</tspan></text>
      <text x="64" y="356.84" class="tb-sass-scss-code" font-size="21"><tspan class="tb-sass-scss-c-punct" xml:space="preserve">}</tspan></text>
      <rect class="tb-sass-scss-caret" x="81" y="340"
            width="10" height="25" fill="#CC6699" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-sass-scss-code" font-size="17"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">@</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">use</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-string" xml:space="preserve">&quot;sass:math&quot;</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="386.6" class="tb-sass-scss-code" font-size="17"><tspan class="tb-sass-scss-c-plain" xml:space="preserve">@</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">use</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-string" xml:space="preserve">&quot;tokens&quot;</tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="417.2" class="tb-sass-scss-code" font-size="17"></text>
      <text x="690" y="447.8" class="tb-sass-scss-code" font-size="17"><tspan class="tb-sass-scss-c-punct" xml:space="preserve">.</tspan><tspan class="tb-sass-scss-c-ident" xml:space="preserve">card</tspan><tspan class="tb-sass-scss-c-plain" xml:space="preserve"> </tspan><tspan class="tb-sass-scss-c-punct" xml:space="preserve">{</tspan></text>
    </g>

    <circle class="tb-sass-scss-spark" cx="1075" cy="260" r="2.43" style="animation-delay:2.41s;animation-duration:3.23s"/>
    <circle class="tb-sass-scss-spark" cx="264" cy="554" r="3.14" style="animation-delay:4.93s;animation-duration:6.31s"/>
    <circle class="tb-sass-scss-spark" cx="81" cy="239" r="3.95" style="animation-delay:0.53s;animation-duration:3.81s"/>
    <circle class="tb-sass-scss-spark" cx="275" cy="215" r="1.97" style="animation-delay:5.03s;animation-duration:6.00s"/>
    <circle class="tb-sass-scss-spark" cx="901" cy="111" r="2.03" style="animation-delay:3.09s;animation-duration:3.38s"/>
    <circle class="tb-sass-scss-spark" cx="284" cy="136" r="1.56" style="animation-delay:5.58s;animation-duration:6.52s"/>
    <circle class="tb-sass-scss-spark" cx="959" cy="421" r="2.75" style="animation-delay:0.00s;animation-duration:3.62s"/>
    <circle class="tb-sass-scss-spark" cx="302" cy="311" r="1.83" style="animation-delay:3.31s;animation-duration:4.92s"/>
    <circle class="tb-sass-scss-spark" cx="77" cy="96" r="3.23" style="animation-delay:0.01s;animation-duration:5.84s"/>
    <circle class="tb-sass-scss-spark" cx="1127" cy="318" r="1.63" style="animation-delay:2.09s;animation-duration:4.86s"/>
    <circle class="tb-sass-scss-spark" cx="240" cy="267" r="2.23" style="animation-delay:1.85s;animation-duration:3.90s"/>
    <circle class="tb-sass-scss-spark" cx="134" cy="570" r="3.70" style="animation-delay:0.14s;animation-duration:3.88s"/>
    <circle class="tb-sass-scss-spark" cx="985" cy="543" r="1.59" style="animation-delay:4.62s;animation-duration:5.26s"/>
    <circle class="tb-sass-scss-spark" cx="139" cy="549" r="2.99" style="animation-delay:4.93s;animation-duration:5.25s"/>
    <circle class="tb-sass-scss-spark" cx="166" cy="522" r="3.11" style="animation-delay:5.86s;animation-duration:6.47s"/>
    <circle class="tb-sass-scss-spark" cx="286" cy="330" r="3.36" style="animation-delay:3.56s;animation-duration:5.94s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-sass-scss-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-sass-scss-vignette)"/>

    <g class="tb-sass-scss-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-sass-scss-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="464" y="206" width="272" height="42" rx="21"
            fill="hsl(198 93% 64%)" fill-opacity="0.13" stroke="hsl(198 93% 64%)" stroke-opacity="0.55"/>
      <text class="tb-sass-scss-chip-t" x="600" y="234" text-anchor="middle" font-size="19">FRONTEND/STYLING</text>
    </g>

    <text class="tb-sass-scss-title" x="600" y="306" text-anchor="middle" font-size="62">Sass 전처리와 SCSS 모듈</text>

    <rect x="470" y="362" width="260" height="2" rx="1" fill="url(#tb-sass-scss-rule)"/>
    <text class="tb-sass-scss-sub" x="600" y="416" text-anchor="middle" font-size="25">컴파일 시점에 사라지는 변수와 모듈</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-sass-scss-badge">
      <circle class="tb-sass-scss-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#CC6699" stroke-opacity="0.45" stroke-width="2"
