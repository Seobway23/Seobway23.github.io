<svg id="tb-hoisting" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-hoisting-t tb-hoisting-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-hoisting-t">호이스팅 — 선언은 먼저 올라간다</title>
  <desc id="tb-hoisting-d">frontend/javascript — 선언하기 전에 쓴 변수가 왜 어떤 때는 undefined 고 어떤 때는 에러인지, 그 차이를 만드는 규칙.</desc>

  <defs>
    <linearGradient id="tb-hoisting-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-hoisting-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-hoisting-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-hoisting-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-hoisting-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-hoisting-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-hoisting-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-hoisting-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-hoisting-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-hoisting-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-hoisting-glow-a { animation: tb-hoisting-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-hoisting-glow-b { animation: tb-hoisting-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-hoisting-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-hoisting-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-hoisting-spark { fill: #ffffff; opacity: 0; animation-name: tb-hoisting-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-hoisting-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-hoisting-sheen-band { animation: tb-hoisting-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-hoisting-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-hoisting-caret { animation: tb-hoisting-blink 1.1s steps(1) infinite; }
    @keyframes tb-hoisting-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-hoisting-halo { animation: tb-hoisting-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-hoisting-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-hoisting-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-hoisting-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-hoisting-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-hoisting-badge-ring { animation: tb-hoisting-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-hoisting-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-hoisting-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-hoisting-tshadow); transition: fill .35s ease; }
    .tb-hoisting-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-hoisting-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-hoisting-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-hoisting-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-hoisting-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-hoisting-c-key    { fill: #f7df1e; }
    .tb-hoisting-c-string { fill: #86efac; }
    .tb-hoisting-c-number { fill: #fbbf24; }
    .tb-hoisting-c-comment{ fill: #64748b; font-style: italic; }
    .tb-hoisting-c-ident  { fill: #cbd5e1; }
    .tb-hoisting-c-punct  { fill: #94a3b8; }
    .tb-hoisting-c-op     { fill: hsl(198 93% 70%); }
    .tb-hoisting-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-hoisting:hover .tb-hoisting-glow-a,
    #tb-hoisting:hover .tb-hoisting-glow-b     { animation-duration: 6s; }
    #tb-hoisting:hover .tb-hoisting-code       { opacity: .62; }
    #tb-hoisting:hover .tb-hoisting-spark      { animation-duration: 1.4s !important; }
    #tb-hoisting:hover .tb-hoisting-sheen-band { animation-duration: 2.6s; }
    #tb-hoisting:hover .tb-hoisting-title      { fill: #ffffff; }
    #tb-hoisting:hover .tb-hoisting-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-hoisting:hover .tb-hoisting-badge      { transform: translateY(-5px); }
    .tb-hoisting-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-hoisting-glow-a, .tb-hoisting-glow-b, .tb-hoisting-spark, .tb-hoisting-sheen-band, .tb-hoisting-caret, .tb-hoisting-halo, .tb-hoisting-badge-ring, .tb-hoisting-bracket {
        animation: none !important;
      }
      .tb-hoisting-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-hoisting-frame)">
    <rect width="1200" height="630" fill="url(#tb-hoisting-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-hoisting-grid)"/>

    <circle class="tb-hoisting-glow-a" cx="144" cy="96" r="397" fill="url(#tb-hoisting-ga)"/>
    <circle class="tb-hoisting-glow-b" cx="1002" cy="431" r="411" fill="url(#tb-hoisting-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-hoisting-code" font-size="21"><tspan class="tb-hoisting-c-ident" xml:space="preserve">console</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">.</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">log</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">a</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve">   </tspan><tspan class="tb-hoisting-c-comment" xml:space="preserve">// undefined      — 에러가 아니다?</tspan></text>
      <text x="64" y="140.12" class="tb-hoisting-code" font-size="21"><tspan class="tb-hoisting-c-key" xml:space="preserve">var</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">a</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-op" xml:space="preserve">=</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-number" xml:space="preserve">1</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="176.24" class="tb-hoisting-code" font-size="21"><tspan class="tb-hoisting-c-ident" xml:space="preserve">console</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">.</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">log</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">b</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve">   </tspan><tspan class="tb-hoisting-c-comment" xml:space="preserve">// ReferenceError — 이건 에러다</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-hoisting-code" font-size="21"><tspan class="tb-hoisting-c-key" xml:space="preserve">let</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">b</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-op" xml:space="preserve">=</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-number" xml:space="preserve">1</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="248.48" class="tb-hoisting-code" font-size="21"><tspan class="tb-hoisting-c-ident" xml:space="preserve">hello</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve">          </tspan><tspan class="tb-hoisting-c-comment" xml:space="preserve">// &quot;안녕&quot;          — 아예 잘 돈다?</tspan></text>
      <text x="64" y="284.6" class="tb-hoisting-code" font-size="21"><tspan class="tb-hoisting-c-key" xml:space="preserve">function</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">hello</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">{</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">console</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">.</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">log</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-string" xml:space="preserve">&quot;안녕&quot;</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">}</tspan></text>
      <rect class="tb-hoisting-caret" x="559" y="268"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-hoisting-code" font-size="17"><tspan class="tb-hoisting-c-ident" xml:space="preserve">console</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">.</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">log</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">a</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve">   </tspan><tspan class="tb-hoisting-c-comment" xml:space="preserve">// undefined      — 에러가 아니다?</tspan></text>
      <text x="690" y="386.6" class="tb-hoisting-code" font-size="17"><tspan class="tb-hoisting-c-key" xml:space="preserve">var</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">a</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-op" xml:space="preserve">=</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-number" xml:space="preserve">1</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="417.2" class="tb-hoisting-code" font-size="17"><tspan class="tb-hoisting-c-ident" xml:space="preserve">console</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">.</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">log</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">(</tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">b</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">)</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve">   </tspan><tspan class="tb-hoisting-c-comment" xml:space="preserve">// ReferenceError — 이건 에러다</tspan></text>
      <text x="690" y="447.8" class="tb-hoisting-code" font-size="17"><tspan class="tb-hoisting-c-key" xml:space="preserve">let</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-ident" xml:space="preserve">b</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-op" xml:space="preserve">=</tspan><tspan class="tb-hoisting-c-plain" xml:space="preserve"> </tspan><tspan class="tb-hoisting-c-number" xml:space="preserve">1</tspan><tspan class="tb-hoisting-c-punct" xml:space="preserve">;</tspan></text>
    </g>

    <circle class="tb-hoisting-spark" cx="145" cy="482" r="3.83" style="animation-delay:1.56s;animation-duration:4.07s"/>
    <circle class="tb-hoisting-spark" cx="930" cy="112" r="3.32" style="animation-delay:1.46s;animation-duration:5.62s"/>
    <circle class="tb-hoisting-spark" cx="230" cy="553" r="1.72" style="animation-delay:3.08s;animation-duration:6.42s"/>
    <circle class="tb-hoisting-spark" cx="159" cy="467" r="3.78" style="animation-delay:3.61s;animation-duration:5.18s"/>
    <circle class="tb-hoisting-spark" cx="188" cy="444" r="3.70" style="animation-delay:1.41s;animation-duration:3.71s"/>
    <circle class="tb-hoisting-spark" cx="63" cy="404" r="1.65" style="animation-delay:5.39s;animation-duration:3.79s"/>
    <circle class="tb-hoisting-spark" cx="110" cy="182" r="2.80" style="animation-delay:3.84s;animation-duration:3.32s"/>
    <circle class="tb-hoisting-spark" cx="929" cy="398" r="3.69" style="animation-delay:5.36s;animation-duration:3.51s"/>
    <circle class="tb-hoisting-spark" cx="1015" cy="199" r="2.01" style="animation-delay:1.94s;animation-duration:4.54s"/>
    <circle class="tb-hoisting-spark" cx="957" cy="106" r="2.03" style="animation-delay:0.61s;animation-duration:4.68s"/>
    <circle class="tb-hoisting-spark" cx="251" cy="104" r="2.20" style="animation-delay:3.59s;animation-duration:4.81s"/>
    <circle class="tb-hoisting-spark" cx="898" cy="135" r="3.64" style="animation-delay:0.13s;animation-duration:6.29s"/>
    <circle class="tb-hoisting-spark" cx="1083" cy="503" r="3.99" style="animation-delay:0.49s;animation-duration:4.70s"/>
    <circle class="tb-hoisting-spark" cx="77" cy="508" r="2.02" style="animation-delay:0.52s;animation-duration:4.36s"/>
    <circle class="tb-hoisting-spark" cx="1085" cy="75" r="1.84" style="animation-delay:3.32s;animation-duration:5.12s"/>
    <circle class="tb-hoisting-spark" cx="1005" cy="419" r="2.58" style="animation-delay:5.04s;animation-duration:5.37s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-hoisting-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-hoisting-vignette)"/>

    <g class="tb-hoisting-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-hoisting-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="206" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-hoisting-chip-t" x="600" y="234" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-hoisting-title" x="600" y="306" text-anchor="middle" font-size="62">호이스팅 — 선언은 먼저 올라간다</text>

    <rect x="470" y="362" width="260" height="2" rx="1" fill="url(#tb-hoisting-rule)"/>
    <text class="tb-hoisting-sub" x="600" y="416" text-anchor="middle" font-size="25">선언하기 전에 쓴 변수가 왜 어떤 때는 undefined 고 어떤 때는 에러인지,…</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-hoisting-badge">
      <circle class="tb-hoisting-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-hoisting-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-hoisting-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-hoisting-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-hoisting-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-hoisting-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-hoisting-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-hoisting-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
