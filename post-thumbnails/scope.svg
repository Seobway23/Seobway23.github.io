<svg id="tb-scope" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-scope-t tb-scope-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-scope-t">스코프 — 변수가 어디까지 보이는가</title>
  <desc id="tb-scope-d">frontend/javascript — 같은 이름의 변수가 왜 어떤 곳에서는 보이고 어떤 곳에서는 안 보이는지, 그 경계를 정하는 규칙.</desc>

  <defs>
    <linearGradient id="tb-scope-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-scope-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-scope-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-scope-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-scope-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-scope-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-scope-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-scope-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-scope-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-scope-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-scope-glow-a { animation: tb-scope-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-scope-glow-b { animation: tb-scope-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-scope-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-scope-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-scope-spark { fill: #ffffff; opacity: 0; animation-name: tb-scope-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-scope-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-scope-sheen-band { animation: tb-scope-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-scope-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-scope-caret { animation: tb-scope-blink 1.1s steps(1) infinite; }
    @keyframes tb-scope-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-scope-halo { animation: tb-scope-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-scope-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-scope-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-scope-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-scope-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-scope-badge-ring { animation: tb-scope-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-scope-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-scope-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-scope-tshadow); transition: fill .35s ease; }
    .tb-scope-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-scope-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-scope-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-scope-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-scope-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-scope-c-key    { fill: #f7df1e; }
    .tb-scope-c-string { fill: #86efac; }
    .tb-scope-c-number { fill: #fbbf24; }
    .tb-scope-c-comment{ fill: #64748b; font-style: italic; }
    .tb-scope-c-ident  { fill: #cbd5e1; }
    .tb-scope-c-punct  { fill: #94a3b8; }
    .tb-scope-c-op     { fill: hsl(198 93% 70%); }
    .tb-scope-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-scope:hover .tb-scope-glow-a,
    #tb-scope:hover .tb-scope-glow-b     { animation-duration: 6s; }
    #tb-scope:hover .tb-scope-code       { opacity: .62; }
    #tb-scope:hover .tb-scope-spark      { animation-duration: 1.4s !important; }
    #tb-scope:hover .tb-scope-sheen-band { animation-duration: 2.6s; }
    #tb-scope:hover .tb-scope-title      { fill: #ffffff; }
    #tb-scope:hover .tb-scope-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-scope:hover .tb-scope-badge      { transform: translateY(-5px); }
    .tb-scope-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-scope-glow-a, .tb-scope-glow-b, .tb-scope-spark, .tb-scope-sheen-band, .tb-scope-caret, .tb-scope-halo, .tb-scope-badge-ring, .tb-scope-bracket {
        animation: none !important;
      }
      .tb-scope-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-scope-frame)">
    <rect width="1200" height="630" fill="url(#tb-scope-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-scope-grid)"/>

    <circle class="tb-scope-glow-a" cx="369" cy="125" r="398" fill="url(#tb-scope-ga)"/>
    <circle class="tb-scope-glow-b" cx="963" cy="473" r="393" fill="url(#tb-scope-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-scope-code" font-size="21"><tspan class="tb-scope-c-key" xml:space="preserve">function</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-ident" xml:space="preserve">outer</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">(</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">)</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-punct" xml:space="preserve">{</tspan></text>
      <text x="64" y="140.12" class="tb-scope-code" font-size="21"><tspan class="tb-scope-c-plain" xml:space="preserve">  </tspan><tspan class="tb-scope-c-key" xml:space="preserve">const</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-ident" xml:space="preserve">secret</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-op" xml:space="preserve">=</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-string" xml:space="preserve">&quot;숨김&quot;</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="176.24" class="tb-scope-code" font-size="21"><tspan class="tb-scope-c-plain" xml:space="preserve">  </tspan><tspan class="tb-scope-c-ident" xml:space="preserve">console</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">.</tspan><tspan class="tb-scope-c-ident" xml:space="preserve">log</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">(</tspan><tspan class="tb-scope-c-ident" xml:space="preserve">secret</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">)</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">;</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-comment" xml:space="preserve">// &quot;숨김&quot;</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-scope-code" font-size="21"><tspan class="tb-scope-c-punct" xml:space="preserve">}</tspan></text>
      <text x="64" y="248.48" class="tb-scope-code" font-size="21"><tspan class="tb-scope-c-ident" xml:space="preserve">outer</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">(</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">)</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="284.6" class="tb-scope-code" font-size="21"><tspan class="tb-scope-c-ident" xml:space="preserve">console</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">.</tspan><tspan class="tb-scope-c-ident" xml:space="preserve">log</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">(</tspan><tspan class="tb-scope-c-ident" xml:space="preserve">secret</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">)</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">;</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-comment" xml:space="preserve">// ReferenceError: secret …</tspan></text>
      <rect class="tb-scope-caret" x="673" y="268"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-scope-code" font-size="17"><tspan class="tb-scope-c-key" xml:space="preserve">function</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-ident" xml:space="preserve">outer</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">(</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">)</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-punct" xml:space="preserve">{</tspan></text>
      <text x="690" y="386.6" class="tb-scope-code" font-size="17"><tspan class="tb-scope-c-plain" xml:space="preserve">  </tspan><tspan class="tb-scope-c-key" xml:space="preserve">const</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-ident" xml:space="preserve">secret</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-op" xml:space="preserve">=</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-string" xml:space="preserve">&quot;숨김&quot;</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="417.2" class="tb-scope-code" font-size="17"><tspan class="tb-scope-c-plain" xml:space="preserve">  </tspan><tspan class="tb-scope-c-ident" xml:space="preserve">console</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">.</tspan><tspan class="tb-scope-c-ident" xml:space="preserve">log</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">(</tspan><tspan class="tb-scope-c-ident" xml:space="preserve">secret</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">)</tspan><tspan class="tb-scope-c-punct" xml:space="preserve">;</tspan><tspan class="tb-scope-c-plain" xml:space="preserve"> </tspan><tspan class="tb-scope-c-comment" xml:space="preserve">// &quot;숨김&quot;</tspan></text>
      <text x="690" y="447.8" class="tb-scope-code" font-size="17"><tspan class="tb-scope-c-punct" xml:space="preserve">}</tspan></text>
    </g>

    <circle class="tb-scope-spark" cx="279" cy="462" r="1.78" style="animation-delay:1.99s;animation-duration:3.69s"/>
    <circle class="tb-scope-spark" cx="297" cy="351" r="3.96" style="animation-delay:0.63s;animation-duration:6.03s"/>
    <circle class="tb-scope-spark" cx="1122" cy="90" r="2.21" style="animation-delay:0.62s;animation-duration:6.56s"/>
    <circle class="tb-scope-spark" cx="69" cy="91" r="3.81" style="animation-delay:3.60s;animation-duration:6.37s"/>
    <circle class="tb-scope-spark" cx="295" cy="341" r="2.38" style="animation-delay:5.12s;animation-duration:3.95s"/>
    <circle class="tb-scope-spark" cx="1052" cy="305" r="2.34" style="animation-delay:0.18s;animation-duration:4.95s"/>
    <circle class="tb-scope-spark" cx="908" cy="465" r="3.40" style="animation-delay:1.99s;animation-duration:4.40s"/>
    <circle class="tb-scope-spark" cx="943" cy="230" r="2.42" style="animation-delay:1.38s;animation-duration:3.48s"/>
    <circle class="tb-scope-spark" cx="179" cy="569" r="2.96" style="animation-delay:0.68s;animation-duration:6.00s"/>
    <circle class="tb-scope-spark" cx="246" cy="526" r="1.56" style="animation-delay:2.41s;animation-duration:4.45s"/>
    <circle class="tb-scope-spark" cx="233" cy="142" r="1.61" style="animation-delay:1.28s;animation-duration:4.26s"/>
    <circle class="tb-scope-spark" cx="266" cy="409" r="3.26" style="animation-delay:3.28s;animation-duration:6.18s"/>
    <circle class="tb-scope-spark" cx="1071" cy="123" r="3.28" style="animation-delay:5.50s;animation-duration:6.01s"/>
    <circle class="tb-scope-spark" cx="65" cy="365" r="3.80" style="animation-delay:2.74s;animation-duration:3.52s"/>
    <circle class="tb-scope-spark" cx="1071" cy="473" r="3.28" style="animation-delay:1.15s;animation-duration:3.93s"/>
    <circle class="tb-scope-spark" cx="233" cy="348" r="3.67" style="animation-delay:1.18s;animation-duration:6.42s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-scope-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-scope-vignette)"/>

    <g class="tb-scope-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-scope-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="166" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-scope-chip-t" x="600" y="194" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-scope-title" x="600" y="266" text-anchor="middle" font-size="62">스코프 — 변수가</text>
      <text class="tb-scope-title" x="600" y="345" text-anchor="middle" font-size="62">어디까지 보이는가</text>

    <rect x="470" y="401" width="260" height="2" rx="1" fill="url(#tb-scope-rule)"/>
    <text class="tb-scope-sub" x="600" y="455" text-anchor="middle" font-size="25">같은 이름의 변수가 왜 어떤 곳에서는 보이고 어떤 곳에서는 안 보이는지,…</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-scope-badge">
      <circle class="tb-scope-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-scope-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-scope-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-scope-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-scope-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-scope-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-scope-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-scope-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
