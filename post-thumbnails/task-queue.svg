<svg id="tb-task-queue" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-task-queue-t tb-task-queue-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-task-queue-t">태스크 큐 — setTimeout 콜백이 줄 서는 곳</title>
  <desc id="tb-task-queue-d">frontend/javascript — setTimeout(fn, 0) 이 0ms 뒤에 돌지 않는 이유</desc>

  <defs>
    <linearGradient id="tb-task-queue-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-task-queue-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-task-queue-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-task-queue-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-task-queue-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-task-queue-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-task-queue-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-task-queue-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-task-queue-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-task-queue-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-task-queue-glow-a { animation: tb-task-queue-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-task-queue-glow-b { animation: tb-task-queue-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-task-queue-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-task-queue-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-task-queue-spark { fill: #ffffff; opacity: 0; animation-name: tb-task-queue-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-task-queue-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-task-queue-sheen-band { animation: tb-task-queue-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-task-queue-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-task-queue-caret { animation: tb-task-queue-blink 1.1s steps(1) infinite; }
    @keyframes tb-task-queue-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-task-queue-halo { animation: tb-task-queue-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-task-queue-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-task-queue-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-task-queue-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-task-queue-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-task-queue-badge-ring { animation: tb-task-queue-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-task-queue-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-task-queue-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-task-queue-tshadow); transition: fill .35s ease; }
    .tb-task-queue-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-task-queue-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-task-queue-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-task-queue-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-task-queue-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-task-queue-c-key    { fill: #f7df1e; }
    .tb-task-queue-c-string { fill: #86efac; }
    .tb-task-queue-c-number { fill: #fbbf24; }
    .tb-task-queue-c-comment{ fill: #64748b; font-style: italic; }
    .tb-task-queue-c-ident  { fill: #cbd5e1; }
    .tb-task-queue-c-punct  { fill: #94a3b8; }
    .tb-task-queue-c-op     { fill: hsl(198 93% 70%); }
    .tb-task-queue-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-task-queue:hover .tb-task-queue-glow-a,
    #tb-task-queue:hover .tb-task-queue-glow-b     { animation-duration: 6s; }
    #tb-task-queue:hover .tb-task-queue-code       { opacity: .62; }
    #tb-task-queue:hover .tb-task-queue-spark      { animation-duration: 1.4s !important; }
    #tb-task-queue:hover .tb-task-queue-sheen-band { animation-duration: 2.6s; }
    #tb-task-queue:hover .tb-task-queue-title      { fill: #ffffff; }
    #tb-task-queue:hover .tb-task-queue-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-task-queue:hover .tb-task-queue-badge      { transform: translateY(-5px); }
    .tb-task-queue-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-task-queue-glow-a, .tb-task-queue-glow-b, .tb-task-queue-spark, .tb-task-queue-sheen-band, .tb-task-queue-caret, .tb-task-queue-halo, .tb-task-queue-badge-ring, .tb-task-queue-bracket {
        animation: none !important;
      }
      .tb-task-queue-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-task-queue-frame)">
    <rect width="1200" height="630" fill="url(#tb-task-queue-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-task-queue-grid)"/>

    <circle class="tb-task-queue-glow-a" cx="325" cy="253" r="349" fill="url(#tb-task-queue-ga)"/>
    <circle class="tb-task-queue-glow-b" cx="919" cy="511" r="427" fill="url(#tb-task-queue-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-task-queue-code" font-size="21"><tspan class="tb-task-queue-c-ident" xml:space="preserve">setTimeout</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-plain" xml:space="preserve"> </tspan><tspan class="tb-task-queue-c-op" xml:space="preserve">=&gt;</tspan><tspan class="tb-task-queue-c-plain" xml:space="preserve"> </tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">console</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">.</tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">log</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-string" xml:space="preserve">&quot;타이머&quot;</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">,</tspan><tspan class="tb-task-queue-c-plain" xml:space="preserve"> </tspan><tspan class="tb-task-queue-c-number" xml:space="preserve">0</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="140.12" class="tb-task-queue-code" font-size="21"><tspan class="tb-task-queue-c-ident" xml:space="preserve">console</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">.</tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">log</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-string" xml:space="preserve">&quot;동기 1&quot;</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="176.24" class="tb-task-queue-code" font-size="21"><tspan class="tb-task-queue-c-ident" xml:space="preserve">console</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">.</tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">log</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-string" xml:space="preserve">&quot;동기 2&quot;</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-task-queue-code" font-size="21"><tspan class="tb-task-queue-c-comment" xml:space="preserve">// 출력: 동기 1 → 동기 2 → 타이머</tspan></text>
      <rect class="tb-task-queue-caret" x="370" y="195"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-task-queue-code" font-size="17"><tspan class="tb-task-queue-c-ident" xml:space="preserve">setTimeout</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-plain" xml:space="preserve"> </tspan><tspan class="tb-task-queue-c-op" xml:space="preserve">=&gt;</tspan><tspan class="tb-task-queue-c-plain" xml:space="preserve"> </tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">console</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">.</tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">log</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-string" xml:space="preserve">&quot;타이머&quot;</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">,</tspan><tspan class="tb-task-queue-c-plain" xml:space="preserve"> </tspan><tspan class="tb-task-queue-c-number" xml:space="preserve">0</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="386.6" class="tb-task-queue-code" font-size="17"><tspan class="tb-task-queue-c-ident" xml:space="preserve">console</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">.</tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">log</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-string" xml:space="preserve">&quot;동기 1&quot;</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="417.2" class="tb-task-queue-code" font-size="17"><tspan class="tb-task-queue-c-ident" xml:space="preserve">console</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">.</tspan><tspan class="tb-task-queue-c-ident" xml:space="preserve">log</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">(</tspan><tspan class="tb-task-queue-c-string" xml:space="preserve">&quot;동기 2&quot;</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">)</tspan><tspan class="tb-task-queue-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="447.8" class="tb-task-queue-code" font-size="17"><tspan class="tb-task-queue-c-comment" xml:space="preserve">// 출력: 동기 1 → 동기 2 → 타이머</tspan></text>
    </g>

    <circle class="tb-task-queue-spark" cx="1117" cy="203" r="2.67" style="animation-delay:4.71s;animation-duration:4.57s"/>
    <circle class="tb-task-queue-spark" cx="1022" cy="347" r="3.39" style="animation-delay:2.61s;animation-duration:6.26s"/>
    <circle class="tb-task-queue-spark" cx="976" cy="290" r="3.69" style="animation-delay:3.44s;animation-duration:5.75s"/>
    <circle class="tb-task-queue-spark" cx="907" cy="447" r="2.10" style="animation-delay:0.67s;animation-duration:4.76s"/>
    <circle class="tb-task-queue-spark" cx="987" cy="491" r="3.24" style="animation-delay:2.40s;animation-duration:3.28s"/>
    <circle class="tb-task-queue-spark" cx="1107" cy="379" r="2.24" style="animation-delay:5.58s;animation-duration:4.00s"/>
    <circle class="tb-task-queue-spark" cx="1084" cy="341" r="1.54" style="animation-delay:3.79s;animation-duration:5.76s"/>
    <circle class="tb-task-queue-spark" cx="285" cy="157" r="2.04" style="animation-delay:2.84s;animation-duration:4.92s"/>
    <circle class="tb-task-queue-spark" cx="154" cy="179" r="1.49" style="animation-delay:5.07s;animation-duration:4.81s"/>
    <circle class="tb-task-queue-spark" cx="1055" cy="164" r="3.26" style="animation-delay:0.58s;animation-duration:3.88s"/>
    <circle class="tb-task-queue-spark" cx="231" cy="284" r="2.12" style="animation-delay:5.78s;animation-duration:3.90s"/>
    <circle class="tb-task-queue-spark" cx="273" cy="506" r="3.10" style="animation-delay:0.10s;animation-duration:5.50s"/>
    <circle class="tb-task-queue-spark" cx="977" cy="503" r="3.95" style="animation-delay:2.65s;animation-duration:3.25s"/>
    <circle class="tb-task-queue-spark" cx="272" cy="471" r="3.50" style="animation-delay:5.83s;animation-duration:6.33s"/>
    <circle class="tb-task-queue-spark" cx="191" cy="348" r="2.22" style="animation-delay:3.68s;animation-duration:3.49s"/>
    <circle class="tb-task-queue-spark" cx="259" cy="417" r="3.68" style="animation-delay:0.91s;animation-duration:3.85s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-task-queue-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-task-queue-vignette)"/>

    <g class="tb-task-queue-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-task-queue-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="176" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-task-queue-chip-t" x="600" y="204" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-task-queue-title" x="600" y="276" text-anchor="middle" font-size="54">태스크 큐 — setTimeout</text>
      <text class="tb-task-queue-title" x="600" y="345" text-anchor="middle" font-size="54">콜백이 줄 서는 곳</text>

    <rect x="470" y="401" width="260" height="2" rx="1" fill="url(#tb-task-queue-rule)"/>
    <text class="tb-task-queue-sub" x="600" y="455" text-anchor="middle" font-size="25">setTimeout(fn, 0) 이 0ms 뒤에 돌지 않는 이유</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-task-queue-badge">
      <circle class="tb-task-queue-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-task-queue-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-task-queue-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-task-queue-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-task-queue-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-task-queue-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-task-queue-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-task-queue-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
