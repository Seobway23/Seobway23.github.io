<svg id="tb-this" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-this-t tb-this-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-this-t">this 바인딩 규칙</title>
  <desc id="tb-this-d">frontend/javascript — 같은 함수에서 this 가 객체를 가리키기도 하고 undefined 가 되기도 하는 이유</desc>

  <defs>
    <linearGradient id="tb-this-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-this-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-this-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-this-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-this-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-this-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-this-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-this-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-this-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-this-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-this-glow-a { animation: tb-this-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-this-glow-b { animation: tb-this-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-this-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-this-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-this-spark { fill: #ffffff; opacity: 0; animation-name: tb-this-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-this-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-this-sheen-band { animation: tb-this-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-this-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-this-caret { animation: tb-this-blink 1.1s steps(1) infinite; }
    @keyframes tb-this-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-this-halo { animation: tb-this-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-this-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-this-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-this-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-this-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-this-badge-ring { animation: tb-this-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-this-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-this-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-this-tshadow); transition: fill .35s ease; }
    .tb-this-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-this-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-this-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-this-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-this-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-this-c-key    { fill: #f7df1e; }
    .tb-this-c-string { fill: #86efac; }
    .tb-this-c-number { fill: #fbbf24; }
    .tb-this-c-comment{ fill: #64748b; font-style: italic; }
    .tb-this-c-ident  { fill: #cbd5e1; }
    .tb-this-c-punct  { fill: #94a3b8; }
    .tb-this-c-op     { fill: hsl(198 93% 70%); }
    .tb-this-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-this:hover .tb-this-glow-a,
    #tb-this:hover .tb-this-glow-b     { animation-duration: 6s; }
    #tb-this:hover .tb-this-code       { opacity: .62; }
    #tb-this:hover .tb-this-spark      { animation-duration: 1.4s !important; }
    #tb-this:hover .tb-this-sheen-band { animation-duration: 2.6s; }
    #tb-this:hover .tb-this-title      { fill: #ffffff; }
    #tb-this:hover .tb-this-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-this:hover .tb-this-badge      { transform: translateY(-5px); }
    .tb-this-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-this-glow-a, .tb-this-glow-b, .tb-this-spark, .tb-this-sheen-band, .tb-this-caret, .tb-this-halo, .tb-this-badge-ring, .tb-this-bracket {
        animation: none !important;
      }
      .tb-this-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-this-frame)">
    <rect width="1200" height="630" fill="url(#tb-this-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-this-grid)"/>

    <circle class="tb-this-glow-a" cx="279" cy="213" r="374" fill="url(#tb-this-ga)"/>
    <circle class="tb-this-glow-b" cx="877" cy="434" r="368" fill="url(#tb-this-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
