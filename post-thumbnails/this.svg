      <text x="64" y="140.12" class="tb-this-code" font-size="21"><tspan class="tb-this-c-plain" xml:space="preserve">  </tspan><tspan class="tb-this-c-ident" xml:space="preserve">name</tspan><tspan class="tb-this-c-op" xml:space="preserve">:</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-string" xml:space="preserve">&quot;민수&quot;</tspan><tspan class="tb-this-c-punct" xml:space="preserve">,</tspan></text>
      <text x="64" y="176.24" class="tb-this-code" font-size="21"><tspan class="tb-this-c-plain" xml:space="preserve">  </tspan><tspan class="tb-this-c-ident" xml:space="preserve">hello</tspan><tspan class="tb-this-c-punct" xml:space="preserve">(</tspan><tspan class="tb-this-c-punct" xml:space="preserve">)</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-punct" xml:space="preserve">{</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-key" xml:space="preserve">return</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-string" xml:space="preserve">`안녕, ${this.name}`</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-punct" xml:space="preserve">}</tspan><tspan class="tb-this-c-punct" xml:space="preserve">,</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-this-code" font-size="21"><tspan class="tb-this-c-punct" xml:space="preserve">}</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="248.48" class="tb-this-code" font-size="21"><tspan class="tb-this-c-ident" xml:space="preserve">user</tspan><tspan class="tb-this-c-punct" xml:space="preserve">.</tspan><tspan class="tb-this-c-ident" xml:space="preserve">hello</tspan><tspan class="tb-this-c-punct" xml:space="preserve">(</tspan><tspan class="tb-this-c-punct" xml:space="preserve">)</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan><tspan class="tb-this-c-plain" xml:space="preserve">            </tspan><tspan class="tb-this-c-comment" xml:space="preserve">// &quot;안녕, 민수&quot;</tspan></text>
      <text x="64" y="284.6" class="tb-this-code" font-size="21"><tspan class="tb-this-c-key" xml:space="preserve">const</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-ident" xml:space="preserve">fn</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-op" xml:space="preserve">=</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-ident" xml:space="preserve">user</tspan><tspan class="tb-this-c-punct" xml:space="preserve">.</tspan><tspan class="tb-this-c-ident" xml:space="preserve">hello</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan><tspan class="tb-this-c-plain" xml:space="preserve">   </tspan><tspan class="tb-this-c-comment" xml:space="preserve">// 같은 함수의 참조를 변수에 할당</tspan></text>
      <text x="64" y="320.71999999999997" class="tb-this-code" font-size="21"><tspan class="tb-this-c-ident" xml:space="preserve">fn</tspan><tspan class="tb-this-c-punct" xml:space="preserve">(</tspan><tspan class="tb-this-c-punct" xml:space="preserve">)</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan><tspan class="tb-this-c-plain" xml:space="preserve">                    </tspan><tspan class="tb-this-c-comment" xml:space="preserve">// TypeError: Cannot r…</tspan></text>
      <rect class="tb-this-caret" x="673" y="304"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-this-code" font-size="17"><tspan class="tb-this-c-key" xml:space="preserve">const</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-ident" xml:space="preserve">user</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-op" xml:space="preserve">=</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-punct" xml:space="preserve">{</tspan></text>
      <text x="690" y="386.6" class="tb-this-code" font-size="17"><tspan class="tb-this-c-plain" xml:space="preserve">  </tspan><tspan class="tb-this-c-ident" xml:space="preserve">name</tspan><tspan class="tb-this-c-op" xml:space="preserve">:</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-string" xml:space="preserve">&quot;민수&quot;</tspan><tspan class="tb-this-c-punct" xml:space="preserve">,</tspan></text>
      <text x="690" y="417.2" class="tb-this-code" font-size="17"><tspan class="tb-this-c-plain" xml:space="preserve">  </tspan><tspan class="tb-this-c-ident" xml:space="preserve">hello</tspan><tspan class="tb-this-c-punct" xml:space="preserve">(</tspan><tspan class="tb-this-c-punct" xml:space="preserve">)</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-punct" xml:space="preserve">{</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-key" xml:space="preserve">return</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-string" xml:space="preserve">`안녕, ${this.name}`</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan><tspan class="tb-this-c-plain" xml:space="preserve"> </tspan><tspan class="tb-this-c-punct" xml:space="preserve">}</tspan><tspan class="tb-this-c-punct" xml:space="preserve">,</tspan></text>
      <text x="690" y="447.8" class="tb-this-code" font-size="17"><tspan class="tb-this-c-punct" xml:space="preserve">}</tspan><tspan class="tb-this-c-punct" xml:space="preserve">;</tspan></text>
    </g>

    <circle class="tb-this-spark" cx="1045" cy="285" r="3.58" style="animation-delay:3.12s;animation-duration:5.97s"/>
    <circle class="tb-this-spark" cx="1033" cy="447" r="2.26" style="animation-delay:3.72s;animation-duration:6.00s"/>
    <circle class="tb-this-spark" cx="235" cy="540" r="3.03" style="animation-delay:4.06s;animation-duration:5.68s"/>
    <circle class="tb-this-spark" cx="1120" cy="105" r="3.83" style="animation-delay:2.84s;animation-duration:4.13s"/>
    <circle class="tb-this-spark" cx="1112" cy="58" r="1.46" style="animation-delay:5.23s;animation-duration:6.06s"/>
    <circle class="tb-this-spark" cx="1124" cy="104" r="2.44" style="animation-delay:1.37s;animation-duration:6.36s"/>
    <circle class="tb-this-spark" cx="267" cy="97" r="2.97" style="animation-delay:2.60s;animation-duration:6.41s"/>
    <circle class="tb-this-spark" cx="1084" cy="313" r="3.55" style="animation-delay:4.58s;animation-duration:4.87s"/>
    <circle class="tb-this-spark" cx="948" cy="263" r="1.48" style="animation-delay:5.16s;animation-duration:3.60s"/>
    <circle class="tb-this-spark" cx="299" cy="215" r="1.52" style="animation-delay:3.07s;animation-duration:5.37s"/>
    <circle class="tb-this-spark" cx="139" cy="237" r="3.44" style="animation-delay:5.99s;animation-duration:6.30s"/>
    <circle class="tb-this-spark" cx="186" cy="208" r="3.33" style="animation-delay:2.46s;animation-duration:4.41s"/>
    <circle class="tb-this-spark" cx="107" cy="403" r="3.79" style="animation-delay:3.61s;animation-duration:4.61s"/>
    <circle class="tb-this-spark" cx="223" cy="523" r="3.04" style="animation-delay:5.91s;animation-duration:5.66s"/>
    <circle class="tb-this-spark" cx="996" cy="569" r="1.68" style="animation-delay:5.82s;animation-duration:5.58s"/>
    <circle class="tb-this-spark" cx="228" cy="209" r="1.40" style="animation-delay:2.13s;animation-duration:4.92s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-this-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-this-vignette)"/>

    <g class="tb-this-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-this-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="198" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-this-chip-t" x="600" y="226" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-this-title" x="600" y="298" text-anchor="middle" font-size="74">this 바인딩 규칙</text>

    <rect x="470" y="354" width="260" height="2" rx="1" fill="url(#tb-this-rule)"/>
    <text class="tb-this-sub" x="600" y="408" text-anchor="middle" font-size="25">같은 함수에서 this 가 객체를 가리키기도 하고 undefined 가 되기도…</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-this-badge">
      <circle class="tb-this-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-this-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-this-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-this-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-this-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-this-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-this-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-this-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
