<svg id="tb-closure" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="tb-closure-t tb-closure-d" preserveAspectRatio="xMidYMid slice">
  <title id="tb-closure-t">클로저 — 함수가 붙잡고 있는 변수</title>
  <desc id="tb-closure-d">frontend/javascript — 함수가 끝났는데도 그 안의 변수가 살아 있는 이유</desc>

  <defs>
    <linearGradient id="tb-closure-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="52%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="tb-closure-ga" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-closure-gb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7df1e" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f7df1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-closure-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#f7df1e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tb-closure-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
      <stop offset="50%" stop-color="hsl(198 93% 70%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(198 93% 70%)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tb-closure-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tb-closure-vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050b14" stop-opacity="0.94"/>
      <stop offset="62%" stop-color="#050b14" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <filter id="tb-closure-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tb-closure-tshadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
    <clipPath id="tb-closure-frame"><rect x="0" y="0" width="1200" height="630" rx="0"/></clipPath>
  </defs>

  <style><![CDATA[
    /* 기본 상태에서도 숨을 쉰다 — img 태그로 넣어도 여기까지는 돈다. */
    .tb-closure-glow-a { animation: tb-closure-driftA 17s ease-in-out infinite alternate; transform-origin: center; }
    .tb-closure-glow-b { animation: tb-closure-driftB 21s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes tb-closure-driftA {
      from { transform: translate(0,0) scale(1);      opacity: .85; }
      to   { transform: translate(46px,-30px) scale(1.12); opacity: 1; }
    }
    @keyframes tb-closure-driftB {
      from { transform: translate(0,0) scale(1.06);   opacity: .7; }
      to   { transform: translate(-54px,26px) scale(.94); opacity: 1; }
    }

    .tb-closure-spark { fill: #ffffff; opacity: 0; animation-name: tb-closure-twinkle;
             animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes tb-closure-twinkle {
      0%, 100% { opacity: 0;   transform: scale(.6); }
      45%      { opacity: .85; transform: scale(1.25); }
      70%      { opacity: .25; transform: scale(.9); }
    }

    .tb-closure-sheen-band { animation: tb-closure-sweep 9s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes tb-closure-sweep {
      0%, 62% { transform: translateX(-1320px); }
      100%    { transform: translateX(1320px); }
    }

    .tb-closure-caret { animation: tb-closure-blink 1.1s steps(1) infinite; }
    @keyframes tb-closure-blink { 0%,49% { opacity: .85 } 50%,100% { opacity: 0 } }

    /* 가운데 어둠은 숨만 쉰다 — 밝아지면 제목이 코드에 먹힌다. */
    .tb-closure-halo { animation: tb-closure-breathe 9s ease-in-out infinite; transform-origin: center; }
    @keyframes tb-closure-breathe {
      0%,100% { transform: scale(1);    opacity: .96; }
      50%     { transform: scale(1.05); opacity: 1; }
    }

    .tb-closure-bracket { stroke: hsl(198 93% 70%); stroke-opacity: .5; stroke-width: 3; fill: none;
               stroke-linecap: round; animation: tb-closure-pulseEdge 5.5s ease-in-out infinite; }
    @keyframes tb-closure-pulseEdge { 0%,100% { stroke-opacity: .28 } 50% { stroke-opacity: .72 } }

    .tb-closure-badge-ring { animation: tb-closure-spin 26s linear infinite; transform-origin: 96px 534px; }
    @keyframes tb-closure-spin { to { transform: rotate(360deg) } }

    /* 글자 */
    .tb-closure-title  { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR",
              "Apple SD Gothic Neo", "Malgun Gothic", Inter, "Segoe UI", sans-serif;
              font-weight: 800; fill: #f8fafc; letter-spacing: -0.5px;
              filter: url(#tb-closure-tshadow); transition: fill .35s ease; }
    .tb-closure-sub    { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo",
              "Malgun Gothic", Inter, sans-serif; font-weight: 500; fill: #a8b6cc; }
    .tb-closure-chip-t { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
              font-weight: 700; fill: hsl(198 93% 70%); letter-spacing: 2.6px; }
    .tb-closure-mark   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 800; }
    .tb-closure-foot   { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 600;
              fill: #64748b; letter-spacing: 1.4px; }

    /* 배경 코드 */
    .tb-closure-code     { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
                opacity: .30; transition: opacity .4s ease; }
    .tb-closure-c-key    { fill: #f7df1e; }
    .tb-closure-c-string { fill: #86efac; }
    .tb-closure-c-number { fill: #fbbf24; }
    .tb-closure-c-comment{ fill: #64748b; font-style: italic; }
    .tb-closure-c-ident  { fill: #cbd5e1; }
    .tb-closure-c-punct  { fill: #94a3b8; }
    .tb-closure-c-op     { fill: hsl(198 93% 70%); }
    .tb-closure-c-plain  { fill: #cbd5e1; }

    /* 인라인 SVG 나 object 태그로 넣었을 때만 살아나는 층.
       이미지로 쓰면 그냥 무시된다 — 그래서 위쪽 기본 애니메이션을 따로 둔 것이다. */
    #tb-closure:hover .tb-closure-glow-a,
    #tb-closure:hover .tb-closure-glow-b     { animation-duration: 6s; }
    #tb-closure:hover .tb-closure-code       { opacity: .62; }
    #tb-closure:hover .tb-closure-spark      { animation-duration: 1.4s !important; }
    #tb-closure:hover .tb-closure-sheen-band { animation-duration: 2.6s; }
    #tb-closure:hover .tb-closure-title      { fill: #ffffff; }
    #tb-closure:hover .tb-closure-bracket    { animation-duration: 1.6s; stroke-width: 4; }
    #tb-closure:hover .tb-closure-badge      { transform: translateY(-5px); }
    .tb-closure-badge { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .tb-closure-glow-a, .tb-closure-glow-b, .tb-closure-spark, .tb-closure-sheen-band, .tb-closure-caret, .tb-closure-halo, .tb-closure-badge-ring, .tb-closure-bracket {
        animation: none !important;
      }
      .tb-closure-spark { opacity: .5; }
    }
  ]]></style>

  <g clip-path="url(#tb-closure-frame)">
    <rect width="1200" height="630" fill="url(#tb-closure-bg)"/>
    <rect width="1200" height="630" fill="url(#tb-closure-grid)"/>

    <circle class="tb-closure-glow-a" cx="267" cy="114" r="362" fill="url(#tb-closure-ga)"/>
    <circle class="tb-closure-glow-b" cx="917" cy="483" r="399" fill="url(#tb-closure-gb)"/>

    <!-- 이 글이 실제로 다루는 코드. 표지가 글마다 달라지는 이유. -->
    <g class="code-main">
      <text x="64" y="104" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-key" xml:space="preserve">function</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-ident" xml:space="preserve">makeCounter</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-punct" xml:space="preserve">{</tspan></text>
      <text x="64" y="140.12" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-plain" xml:space="preserve">  </tspan><tspan class="tb-closure-c-key" xml:space="preserve">let</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-ident" xml:space="preserve">count</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">=</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-number" xml:space="preserve">0</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="176.24" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-plain" xml:space="preserve">  </tspan><tspan class="tb-closure-c-key" xml:space="preserve">return</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">=&gt;</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">++</tspan><tspan class="tb-closure-c-ident" xml:space="preserve">count</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="212.35999999999999" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-punct" xml:space="preserve">}</tspan></text>
      <text x="64" y="248.48" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-key" xml:space="preserve">const</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-ident" xml:space="preserve">next</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">=</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-ident" xml:space="preserve">makeCounter</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan></text>
      <text x="64" y="284.6" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-ident" xml:space="preserve">console</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">.</tspan><tspan class="tb-closure-c-ident" xml:space="preserve">log</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-ident" xml:space="preserve">next</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-comment" xml:space="preserve">// 1</tspan></text>
      <text x="64" y="320.71999999999997" class="tb-closure-code" font-size="21"><tspan class="tb-closure-c-ident" xml:space="preserve">console</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">.</tspan><tspan class="tb-closure-c-ident" xml:space="preserve">log</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-ident" xml:space="preserve">next</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-comment" xml:space="preserve">// 2   ← makeCounter 는 이미 …</tspan></text>
      <rect class="tb-closure-caret" x="673" y="304"
            width="10" height="25" fill="#f7df1e" opacity=".8"/>
    </g>
    <g class="code-echo" opacity="0.55">
      <text x="690" y="356" class="tb-closure-code" font-size="17"><tspan class="tb-closure-c-key" xml:space="preserve">function</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-ident" xml:space="preserve">makeCounter</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-punct" xml:space="preserve">{</tspan></text>
      <text x="690" y="386.6" class="tb-closure-code" font-size="17"><tspan class="tb-closure-c-plain" xml:space="preserve">  </tspan><tspan class="tb-closure-c-key" xml:space="preserve">let</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-ident" xml:space="preserve">count</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">=</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-number" xml:space="preserve">0</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="417.2" class="tb-closure-code" font-size="17"><tspan class="tb-closure-c-plain" xml:space="preserve">  </tspan><tspan class="tb-closure-c-key" xml:space="preserve">return</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-punct" xml:space="preserve">(</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">)</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">=&gt;</tspan><tspan class="tb-closure-c-plain" xml:space="preserve"> </tspan><tspan class="tb-closure-c-op" xml:space="preserve">++</tspan><tspan class="tb-closure-c-ident" xml:space="preserve">count</tspan><tspan class="tb-closure-c-punct" xml:space="preserve">;</tspan></text>
      <text x="690" y="447.8" class="tb-closure-code" font-size="17"><tspan class="tb-closure-c-punct" xml:space="preserve">}</tspan></text>
    </g>

    <circle class="tb-closure-spark" cx="212" cy="553" r="2.63" style="animation-delay:0.99s;animation-duration:5.25s"/>
    <circle class="tb-closure-spark" cx="939" cy="576" r="3.36" style="animation-delay:2.19s;animation-duration:3.72s"/>
    <circle class="tb-closure-spark" cx="1031" cy="253" r="2.41" style="animation-delay:1.20s;animation-duration:3.83s"/>
    <circle class="tb-closure-spark" cx="1055" cy="216" r="1.97" style="animation-delay:4.00s;animation-duration:3.96s"/>
    <circle class="tb-closure-spark" cx="159" cy="573" r="1.68" style="animation-delay:4.05s;animation-duration:5.21s"/>
    <circle class="tb-closure-spark" cx="123" cy="149" r="1.95" style="animation-delay:0.53s;animation-duration:5.74s"/>
    <circle class="tb-closure-spark" cx="220" cy="74" r="1.65" style="animation-delay:4.33s;animation-duration:4.20s"/>
    <circle class="tb-closure-spark" cx="1090" cy="161" r="2.64" style="animation-delay:5.55s;animation-duration:4.58s"/>
    <circle class="tb-closure-spark" cx="954" cy="91" r="1.73" style="animation-delay:5.39s;animation-duration:4.52s"/>
    <circle class="tb-closure-spark" cx="1018" cy="551" r="3.94" style="animation-delay:2.39s;animation-duration:6.45s"/>
    <circle class="tb-closure-spark" cx="944" cy="179" r="2.26" style="animation-delay:2.51s;animation-duration:5.74s"/>
    <circle class="tb-closure-spark" cx="944" cy="294" r="1.78" style="animation-delay:2.31s;animation-duration:4.09s"/>
    <circle class="tb-closure-spark" cx="1073" cy="244" r="1.99" style="animation-delay:5.36s;animation-duration:6.47s"/>
    <circle class="tb-closure-spark" cx="223" cy="267" r="3.71" style="animation-delay:3.75s;animation-duration:5.44s"/>
    <circle class="tb-closure-spark" cx="1022" cy="85" r="2.64" style="animation-delay:0.65s;animation-duration:3.53s"/>
    <circle class="tb-closure-spark" cx="906" cy="465" r="2.96" style="animation-delay:0.70s;animation-duration:6.60s"/>

    <!-- 가운데를 어둡게 눌러 제목이 코드 위에서 읽히게 한다.
         판을 덮지 않는 이유 — 그 글의 코드가 표지의 내용이기 때문이다. -->
    <ellipse class="tb-closure-halo" cx="600" cy="315" rx="560" ry="252" fill="url(#tb-closure-vignette)"/>

    <g class="tb-closure-sheen-band">
      <rect x="0" y="0" width="540" height="630" fill="url(#tb-closure-sheen)"/>
    </g>

    <!-- 카테고리 칩 -->
    <g>
      <rect x="446" y="166" width="309" height="42" rx="21"
            fill="hsl(198 93% 70%)" fill-opacity="0.13" stroke="hsl(198 93% 70%)" stroke-opacity="0.55"/>
      <text class="tb-closure-chip-t" x="600" y="194" text-anchor="middle" font-size="19">FRONTEND/JAVASCRIPT</text>
    </g>

    <text class="tb-closure-title" x="600" y="266" text-anchor="middle" font-size="62">클로저 — 함수가</text>
      <text class="tb-closure-title" x="600" y="345" text-anchor="middle" font-size="62">붙잡고 있는 변수</text>

    <rect x="470" y="401" width="260" height="2" rx="1" fill="url(#tb-closure-rule)"/>
    <text class="tb-closure-sub" x="600" y="455" text-anchor="middle" font-size="25">함수가 끝났는데도 그 안의 변수가 살아 있는 이유</text>

    <!-- 왼쪽 아래 배지 -->
    <g class="tb-closure-badge">
      <circle class="tb-closure-badge-ring" cx="96" cy="534" r="44" fill="none"
              stroke="#f7df1e" stroke-opacity="0.45" stroke-width="2"
              stroke-dasharray="10 14" stroke-linecap="round"/>
      <rect x="66" y="504" width="60" height="60" rx="16"
            fill="#f7df1e" fill-opacity="0.92"/>
      <text class="tb-closure-mark" x="96" y="546" text-anchor="middle" font-size="26"
            fill="#0b1220">JS</text>
    </g>

    <text class="tb-closure-foot" x="1128" y="540" text-anchor="end" font-size="17">FRONTEND/JAVASCRIPT</text>
    <text class="tb-closure-foot" x="1128" y="566" text-anchor="end" font-size="15"
          opacity=".7">MODERNDEVBLOG</text>

    <!-- 네 귀퉁이 꺾쇠 — "펼쳐 놓은 노트" 를 만든다 -->
    <path class="tb-closure-bracket" d="M34 92 L34 34 L92 34"/>
    <path class="tb-closure-bracket" d="M1108 34 L1166 34 L1166 92"/>
    <path class="tb-closure-bracket" d="M34 538 L34 596 L92 596"/>
    <path class="tb-closure-bracket" d="M1108 596 L1166 596 L1166 538"/>

    <rect x="0" y="0" width="1200" height="630" fill="none"
          stroke="hsl(198 93% 70%)" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
