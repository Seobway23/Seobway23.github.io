<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">user.name 을 바꿀 때의 구조적 공유</title>
  <desc id="d">왼쪽 이전 state 와 오른쪽 새 state. 새 state 는 state 와 user 두 객체만 새로 만들고, address 와 posts 는 이전 객체를 그대로 가리킨다.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7df1e"/>
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; white-space: pre; }
    .h { fill: #f8fafc; font-size: 16px; font-weight: 700; }
    .k { fill: #e2e8f0; font-size: 14px; font-weight: 700; }
    .v { fill: #94a3b8; font-size: 12.5px; }
    .newv { fill: #fde047; font-size: 12.5px; }
    .note { fill: #94a3b8; font-size: 12.5px; }
  </style>

  <rect width="960" height="420" rx="20" fill="#0f172a"/>

  <text class="h" x="40" y="44">이전 state</text>
  <text class="h" x="700" y="44">새 state (next)</text>

  <!-- 이전 트리 -->
  <rect x="40" y="64" width="170" height="52" rx="10" fill="#111827" stroke="#475569"/>
  <text class="k mono" x="58" y="96">state</text>

  <rect x="60" y="164" width="170" height="60" rx="10" fill="#111827" stroke="#475569"/>
  <text class="k mono" x="78" y="190">user</text>
  <text class="v mono" x="78" y="211">name: "a"</text>

  <!-- 공유되는 객체 (가운데) -->
  <rect x="395" y="290" width="170" height="60" rx="10" fill="#111827" stroke="#64748b" stroke-dasharray="5 4"/>
  <text class="k mono" x="413" y="316">address</text>
  <text class="v mono" x="413" y="337">city: "서울"</text>

  <rect x="395" y="164" width="170" height="60" rx="10" fill="#111827" stroke="#64748b" stroke-dasharray="5 4"/>
  <text class="k mono" x="413" y="190">posts</text>
  <text class="v mono" x="413" y="211">[{ id: 1 }]</text>

  <!-- 새 트리 -->
  <rect x="720" y="64" width="190" height="52" rx="10" fill="#1c1a0b" stroke="#f7df1e" stroke-width="1.6"/>
  <text class="k mono" x="738" y="96">state'</text>
  <text class="newv" x="808" y="96">새 객체</text>

  <rect x="720" y="250" width="190" height="60" rx="10" fill="#1c1a0b" stroke="#f7df1e" stroke-width="1.6"/>
  <text class="k mono" x="738" y="276">user'</text>
  <text class="newv mono" x="738" y="297">name: "b"</text>

  <!-- 이전 참조 -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ag)">
    <path d="M125 116 L140 160"/>
    <path d="M210 92 C 320 92, 400 120, 440 160"/>
    <path d="M150 224 C 170 300, 300 320, 390 320"/>
  </g>

  <!-- 새 참조 -->
  <g stroke="#f7df1e" stroke-width="1.6" fill="none" marker-end="url(#ay)">
    <path d="M800 116 L810 246"/>
    <path d="M720 96 C 640 100, 590 140, 568 168"/>
    <path d="M720 290 C 660 300, 620 316, 569 318"/>
  </g>

  <line x1="40" y1="372" x2="920" y2="372" stroke="#334155"/>
  <text class="note mono" x="40" y="398">next.user === state.user → false     next.posts === state.posts → true     next.user.address === state.user.address → true</text>
</svg>
